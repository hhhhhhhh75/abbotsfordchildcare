<main>
    <form class="inquire-form" action="inquire.php" method="post">
        <h1>Inquire Now</h1>
        <div>
            <label for="pname">Parent's Name</label>
            <input name="pname" id="pname" type="text">
        </div>
        <div>
            <label for="email">Parent's Email</label>
            <input type="email" id="email" autocomplete="email">
        </div>
        <div>
            <label for="tel">Parent's Phone Number</label>
            <input name="tel" id="tel" type="tel" autocomplete="tel">
        </div>
        <div>
            <label for="cname">Child's Full Name</label>
            <input name="cname" id="cname" type="text">
        </div>
        <div>
            <label for="cbday">Child's Birthdate</label>
            <input name="cbday" id="cbday" type="date">
        </div>
        <div>
        <label for="program">Preferred Program</label>
        <select id="program" name="program">
            <option>Select Program</option>
            <option>Program 1</option>
            <option>Program 2</option>
            <option>Program 3</option>
        </select>
        </div>
        <div>
            <label for="startDate">Preferred Start Date</label>
            <input name="startDate" id="startDate" type="date">
        </div>
        <div>
            <label for="questions">Any Questions?</label>
            <textarea name="questions" id="questions"></textarea>
        </div>
        <input type="submit">
    </form>
